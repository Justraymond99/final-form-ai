name: PHPUnit Assignment
on:
  push:
    paths:
      - 'php/**'
      - 'tests/**'
      - 'composer.json'
      - '.github/workflows/phpunit-assignment.yml'
  workflow_dispatch:
jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install PHPUnit with Composer
        run: composer install --no-interaction --prefer-dist
      - name: Run unit tests
        run: composer test
